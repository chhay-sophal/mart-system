services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mart
      POSTGRES_PASSWORD: mart
      POSTGRES_DB: mart_system_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mart"]
      interval: 5s
      retries: 10
  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pgdata: {}
