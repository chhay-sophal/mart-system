name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Mart System POS ${context.ref.replace('refs/tags/', '')}`,
              body: 'Download the installer for your platform below.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cross-builds all 3 target binaries from one host in one go, shared via
      # artifact with the per-platform matrix below instead of rebuilding
      # there (which would redo this 3x for no reason).
      #
      # @yao-pkg/pkg's fresh (uncached) base-binary fetch-and-build is
      # genuinely flaky in a cold environment like a CI runner -- confirmed
      # by reproducing both a clean success and a silent failure locally
      # under identical cold-cache conditions, back to back. Retrying the
      # whole command is the actual fix, not a workaround for a
      # misconfiguration.
      - name: Build backend sidecar binaries
        run: |
          for i in 1 2 3; do
            rm -rf apps/pos/sidecar/dist apps/pos/src-tauri/binaries
            if pnpm --filter @mart-system/pos-sidecar build; then
              exit 0
            fi
            echo "Sidecar build attempt $i failed, retrying..."
            sleep 5
          done
          echo "Sidecar build failed after 3 attempts"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: pos-sidecar-binaries
          path: apps/pos/src-tauri/binaries/

  build:
    needs: [create-release, build-sidecar]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            rust-target: ''
            args: --bundles nsis
          - platform: ubuntu-latest
            rust-target: ''
            args: --bundles appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' apps/pos/src-tauri/tauri.conf.json > tmp.json && mv tmp.json apps/pos/src-tauri/tauri.conf.json
          perl -i -pe "s/^version = .*/version = \"$VERSION\"/" apps/pos/src-tauri/Cargo.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux system dependencies for Tauri
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev libxdo-dev

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: pos-sidecar-binaries
          path: apps/pos/src-tauri/binaries/

      # actions/upload-artifact's zip transport can drop the executable bit.
      - name: Restore executable bit on the downloaded sidecar binaries
        if: matrix.platform != 'windows-latest'
        run: chmod +x apps/pos/src-tauri/binaries/*

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/pos
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: npx @tauri-apps/cli@2
          createUpdaterArtifacts: v2Compatible
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
