name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Mart System POS ${context.ref.replace('refs/tags/', '')}`,
              body: 'Download the installer for your platform below.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            pkg-target: node20-macos-arm64
            sidecar-name: backend-server-aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            pkg-target: node20-win-x64
            sidecar-name: backend-server-x86_64-pc-windows-msvc.exe
            rust-target: ''
            args: --bundles nsis
          - platform: ubuntu-latest
            pkg-target: node20-linux-x64
            sidecar-name: backend-server-x86_64-unknown-linux-gnu
            rust-target: ''
            args: --bundles appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' apps/pos/src-tauri/tauri.conf.json > tmp.json && mv tmp.json apps/pos/src-tauri/tauri.conf.json
          perl -i -pe "s/^version = .*/version = \"$VERSION\"/" apps/pos/src-tauri/Cargo.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux system dependencies for Tauri
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev libxdo-dev

      - run: pnpm install --frozen-lockfile

      # Mirrors the online-pos project's proven recipe: one target per matrix
      # job (not 3 combined in one pkg invocation -- that auto-templated
      # output naming was unreliable), CI=false (pkg/pkg-fetch behaves
      # differently, and more reliably, when it doesn't detect a CI
      # environment), and a plain glob-and-copy right after pkg exits instead
      # of a separate script checking for the file afterward.
      - name: Build backend sidecar binary
        shell: bash
        env:
          CI: false
        working-directory: apps/pos/sidecar
        run: |
          npx @yao-pkg/pkg server.js \
            --targets ${{ matrix.pkg-target }} \
            --output dist/sidecar \
            --no-bytecode --public-packages '*' --public
          SRC=$(ls dist/sidecar* 2>/dev/null | head -1)
          mkdir -p ../src-tauri/binaries
          cp "$SRC" ../src-tauri/binaries/${{ matrix.sidecar-name }}
          chmod +x ../src-tauri/binaries/${{ matrix.sidecar-name }} || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/pos
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: npx @tauri-apps/cli@2
          createUpdaterArtifacts: v2Compatible
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
