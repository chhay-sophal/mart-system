name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm install leaves a stub Prisma Client (schema is not at the default
      # path). Generate against apps/backend/prisma/schema.prisma before tsc.
      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npx prisma generate
        env:
          DATABASE_URL: file:./test.db

      - run: pnpm typecheck
        env:
          DATABASE_URL: file:./test.db

      - run: pnpm lint

      - name: Apply backend migrations to the test database
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./test.db

      - run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db
          JWT_SECRET: test-jwt-secret-do-not-use
