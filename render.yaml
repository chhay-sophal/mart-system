services:
  - type: web
    name: mart-system-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below is a secret/deployment-specific value -- Render
      # prompts for these once when the Blueprint is applied rather than
      # having them committed here. See DEPLOYMENT.md for where each value
      # comes from. PORT is deliberately not listed -- Render injects it
      # automatically and src/env.ts already reads it from the environment.
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_TTL
        sync: false
      - key: REFRESH_TOKEN_TTL
        sync: false
      - key: CASHIER_SESSION_TTL
        sync: false
      - key: PASSWORD_BCRYPT_COST
        sync: false
      - key: PIN_BCRYPT_COST
        sync: false
